name: Release

# Builds the extension and attaches it to a GitHub Release.
#
# This workflow exists because of a real failure: `dist/` was gitignored, so
# someone who downloaded the source and pointed "Load unpacked" at it got
# "Manifest file is missing or unreadable". A downloadable, already-built
# package was the fix — telling people to install a toolchain first was not.
#
# `dist/` and the root manifest are COMMITTED now, so the repository download is
# loadable on its own and this archive is no longer the only way in. It is still
# worth publishing: it is a tenth of the size, it carries INSTALL-FIRST.txt at
# its root, and a release is what a person links to when telling a colleague
# where to get the tool.
on:
  push:
    tags: ['v*']
  # Manual runs matter as much as tagged ones: it is how a ready-to-install
  # build is produced from the current branch without inventing a version.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create or update (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build, package and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        # The same gate CI applies. A release that skipped the tests would be
        # the one build nobody checked, which is the wrong one to hand out.
        run: npm run verify

      - name: Assert the build is offline-only
        run: node scripts/assert-offline.mjs

      - name: Build the store package
        # No source maps: they were 78% of the package and a store listing has
        # no bug reports to symbolicate.
        run: npm run build:store

      - name: Assert the package satisfies the store rules
        run: npm run store:check

      - name: Package extension
        run: npm run package

      - name: Resolve the tag
        id: tag
        run: echo "value=${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: Universal BhuNex Converter ${{ steps.tag.outputs.value }}
          generate_release_notes: true
          files: dist-zip/*.zip
          body: |
            ## Install — no build step, no Node

            1. Download the `.zip` below.
            2. **Unzip it to a local folder such as `C:\Extensions\`** — not
               under OneDrive, Desktop, Documents or Downloads. Browsers load a
               folder, not an archive, and they re-read that folder on every
               start, so leave it where you put it.
            3. Open `chrome://extensions` (Chrome) or `edge://extensions`
               (Edge) and turn on **Developer mode**.
            4. Click **Load unpacked** and select the **unzipped folder** —
               the one that directly contains `manifest.json`.
            5. Click the toolbar icon → **Open converter workspace**.

            `INSTALL-FIRST.txt` at the top of the archive repeats all of this.

            ### If you see "Manifest file is missing or unreadable"

            There are three causes, in the order they actually happen:

            - **The folder is inside OneDrive.** On a work laptop, Desktop,
              Documents and Downloads are usually synced, and OneDrive replaces
              files with cloud placeholders. Explorer shows `manifest.json`,
              but the browser reads extension files directly and cannot trigger
              the download. Move the folder to `C:\Extensions\` and load again.
            - **The wrong folder is selected.** Pick the folder that has
              `manifest.json` directly in it, not the folder containing it.
            - **You selected the `extension` folder.** That is TypeScript
              source, not a built extension. From this ZIP there is no such
              folder — select the folder you extracted.

            ### You do not have to use this ZIP

            The repository itself is loadable. **Code → Download ZIP**, extract
            it outside OneDrive, and select the extracted folder: it carries a
            `manifest.json` at its top level, and the built extension is
            committed under `dist/`. Either works; this archive is simply the
            smaller download.

            Everything runs locally. No file leaves the machine, and the
            packaged build is checked to contain no remote script, style or
            font before it is published.

      - name: Remove archives from previous versions
        # v1.6.0 published with a 1.5.0 archive attached beside it. `dist-zip/`
        # is committed and `files: dist-zip/*.zip` uploads whatever is in it, so
        # the previous version's archive rode along — two downloads on a release
        # page, one of them the version the release is not. Someone picking the
        # wrong one gets a build without the current fixes and nothing to
        # suggest anything is wrong.
        #
        # `package-extension.mjs` now prunes the directory, which stops it
        # happening again. This step also cleans a release that already has one,
        # so re-running the workflow for an affected tag repairs it rather than
        # leaving it to be noticed by whoever downloads next.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          keep="universal-bhunex-converter-$(node -p "require('./extension/manifest.json').version").zip"
          echo "keeping: $keep"
          gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r asset; do
            case "$asset" in
              "$keep") ;;
              *.zip)
                echo "removing a stale archive: $asset"
                gh release delete-asset "$TAG" "$asset" --yes
                ;;
            esac
          done
