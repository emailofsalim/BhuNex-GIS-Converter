name: Release

# Builds the extension and attaches it to a GitHub Release, so it can be
# installed WITHOUT Node, npm or a build step.
#
# This workflow exists because of a real failure: the repository ships
# TypeScript, `dist/` is gitignored, and someone who downloads the source ZIP
# and points "Load unpacked" at the folder gets "Manifest file is missing or
# unreadable". A downloadable, already-built package is the fix — telling
# people to install a toolchain first is not.
on:
  push:
    tags: ['v*']
  # Manual runs matter as much as tagged ones: it is how a ready-to-install
  # build is produced from the current branch without inventing a version.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create or update (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build, package and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        # The same gate CI applies. A release that skipped the tests would be
        # the one build nobody checked, which is the wrong one to hand out.
        run: npm run verify

      - name: Assert the build is offline-only
        run: node scripts/assert-offline.mjs

      - name: Build the store package
        # No source maps: they were 78% of the package and a store listing has
        # no bug reports to symbolicate.
        run: npm run build:store

      - name: Assert the package satisfies the store rules
        run: npm run store:check

      - name: Package extension
        run: npm run package

      - name: Resolve the tag
        id: tag
        run: echo "value=${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: Universal BhuNex Converter ${{ steps.tag.outputs.value }}
          generate_release_notes: true
          files: dist-zip/*.zip
          body: |
            ## Install — no build step, no Node

            1. Download the `.zip` below.
            2. **Unzip it to a local folder such as `C:\Extensions\`** — not
               under OneDrive, Desktop, Documents or Downloads. Browsers load a
               folder, not an archive, and they re-read that folder on every
               start, so leave it where you put it.
            3. Open `chrome://extensions` (Chrome) or `edge://extensions`
               (Edge) and turn on **Developer mode**.
            4. Click **Load unpacked** and select the **unzipped folder** —
               the one that directly contains `manifest.json`.
            5. Click the toolbar icon → **Open converter workspace**.

            `INSTALL-FIRST.txt` at the top of the archive repeats all of this.

            ### If you see "Manifest file is missing or unreadable"

            There are three causes, in the order they actually happen:

            - **The folder is inside OneDrive.** On a work laptop, Desktop,
              Documents and Downloads are usually synced, and OneDrive replaces
              files with cloud placeholders. Explorer shows `manifest.json`,
              but the browser reads extension files directly and cannot trigger
              the download. Move the folder to `C:\Extensions\` and load again.
            - **The wrong folder is selected.** Pick the folder that has
              `manifest.json` directly in it, not the folder containing it.
            - **It is the source code, not this package.** The green **Code**
              button gives you TypeScript that has to be built first. This ZIP
              is that build.

            Everything runs locally. No file leaves the machine, and the
            packaged build is checked to contain no remote script, style or
            font before it is published.
