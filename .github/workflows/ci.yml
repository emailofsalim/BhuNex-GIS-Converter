name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build, package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        # npm ci installs exactly what the lockfile pins and fails if the
        # lockfile and package.json disagree, so two runs of the same commit
        # can never resolve different toolchains.
        run: npm ci

      - name: Audit production dependencies
        # The shipped extension has zero runtime dependencies, so this step must
        # stay clean. If it ever fails, a runtime dependency crept in.
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit build tooling (informational)
        run: npm audit --audit-level=low || true

      - name: Typecheck
        run: npm run lint

      - name: Test
        run: npm test

      - name: Assert the format matrix matches the registry
        # docs/FORMAT_MATRIX.md is generated. A stale support table is exactly
        # the kind of inaccuracy rule R1 exists to prevent, so it is a build
        # failure rather than a documentation chore.
        run: npm run docs:check

      - name: Assert the committed build matches the source
        # dist/ is COMMITTED, because a browser loads a folder and cannot build
        # one — without it, downloading this repository and pointing "Load
        # unpacked" at it gives "Manifest file is missing or unreadable", which
        # is the obvious use of the repository failing.
        #
        # The real risk of committing build output is that it goes stale
        # silently, and a stale extension is worse than none: the bug report
        # describes code that is already fixed. So this rebuilds from source
        # into a temporary directory and compares every file byte for byte.
        # It runs BEFORE the local build below, which would overwrite dist/.
        run: npm run build:check

      - name: Build extension
        run: npm run build

      - name: Assert the build is offline-only
        # Rule R15: no CDN, no remote script, style, font or fetch may appear in
        # the packaged output. Grep is the cheapest possible enforcement and it
        # catches an accidental import long before a reviewer would.
        run: node scripts/assert-offline.mjs

      - name: Assert the package satisfies the store rules
        # Every rule here is one the Chrome Web Store or Edge Add-ons rejects
        # for. The description limit is 132 characters and is enforced silently
        # at upload — this project shipped at 134 once, which would have been an
        # automatic rejection nobody could have spotted by reading the manifest.
        run: npm run store:check

      - name: Assert the committed package is the one the source produces
        # The same argument as the committed dist/, for the ZIP: someone who
        # downloads dist-zip/*.zip from the repository must be getting the
        # archive this commit builds, not an older one left behind.
        run: |
          npm run build:store
          node scripts/package-extension.mjs
          git diff --exit-code --stat -- dist dist-zip || {
            echo
            echo "dist/ or dist-zip/ is not what this source builds."
            echo "Run: npm run build:store && npm run package"
            echo "then commit dist/ and dist-zip/ with your change."
            exit 1
          }

      - name: Package extension and verify the archive
        # `npm run package` builds the ZIP and then validates it with
        # scripts/verify-package.mjs, which reads the archive the way a STRICT
        # extractor does rather than the way a tolerant library does.
        #
        # This matters because v1.0.0 through v1.0.2 shipped an archive whose
        # End Of Central Directory record under-reported its entry count by
        # one. Node, Python, 7-Zip and macOS all scan and recover, so every
        # check we had passed. `unzip` and Windows Explorer do not, and a
        # partial extraction on Windows shows up in the browser as
        # "Manifest file is missing or unreadable" — which is what a user hit.
        run: npm run package

      - name: Upload unpacked extension
        uses: actions/upload-artifact@v4
        with:
          name: bhunex-gis-converter-unpacked
          path: dist/
          if-no-files-found: error

      - name: Upload packaged extension
        uses: actions/upload-artifact@v4
        with:
          name: bhunex-gis-converter-zip
          path: dist-zip/*.zip
          if-no-files-found: error
